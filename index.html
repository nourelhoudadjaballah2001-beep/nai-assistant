<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#a2364a" />
  <title>مساعد ناي</title>
  <style>
    @font-face{font-family:'Tajawal';font-weight:400;src:url('fonts/Tajawal-Regular.ttf') format('truetype');font-display:swap}
    @font-face{font-family:'Tajawal';font-weight:500;src:url('fonts/Tajawal-Medium.ttf') format('truetype');font-display:swap}
    @font-face{font-family:'Tajawal';font-weight:600;src:url('fonts/Tajawal-Bold.ttf') format('truetype');font-display:swap}
    @font-face{font-family:'Tajawal';font-weight:700;src:url('fonts/Tajawal-Bold.ttf') format('truetype');font-display:swap}
    @font-face{font-family:'Tajawal';font-weight:800;src:url('fonts/Tajawal-ExtraBold.ttf') format('truetype');font-display:swap}
  </style>


  <style>
    :root {
      --primary: #a2364a;
      --primary-dark: #7f2639;
      --primary-soft: #f9e9eb;
      --accent: #eba9af;
      --accent-soft: #fdf1f2;
      --bg: #fcf7f1;
      --surface: #ffffff;
      --surface-soft: #fef9f6;
      --text: #3b2229;
      --muted: #7a6167;
      --border: #f0dfe0;
      --shadow: 0 10px 30px rgba(127, 38, 57, 0.08);
      --danger: #b4432e;
      --danger-soft: #fceae6;
      --success: #3f7058;
      --success-soft: #e7f1ea;
      --warning: #8c6430;
      --warning-soft: #f7edda;
      --info: #a2364a;
      --info-soft: #f9e4e7;
      --ready: #774463;
      --ready-soft: #f2e7ee;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Tajawal", Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(162, 54, 74, 0.28);
      outline-offset: 2px;
    }

    .app-shell {
      width: min(100%, 780px);
      min-height: 100vh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      display: block;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      object-fit: contain;
      object-position: center;
      border-radius: 10px;
    }

    .brand-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .date-badge {
      max-width: 145px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.45;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border-radius: var(--radius-lg);
      background:
        radial-gradient(circle at 85% 5%, rgba(255, 255, 255, 0.26) 0 65px, transparent 66px),
        linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 12px 28px rgba(127, 38, 57, 0.24);
    }

    .hero::after {
      content: "✦";
      position: absolute;
      left: 20px;
      bottom: -19px;
      color: rgba(255, 255, 255, 0.14);
      font-size: 105px;
      line-height: 1;
      transform: rotate(14deg);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero p {
      margin: 0 0 4px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      font-weight: 500;
    }

    .hero h1 {
      margin: 0;
      max-width: 290px;
      font-size: clamp(24px, 6vw, 31px);
      font-weight: 800;
      line-height: 1.35;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0 22px;
    }

    .stat-card {
      min-height: 100px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(127, 38, 57, 0.05);
    }

    .stat-card.total {
      grid-column: span 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 92px;
      background: linear-gradient(135deg, #fff, var(--accent-soft));
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .stat-value {
      margin-top: 8px;
      color: var(--text);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .total .stat-value {
      margin: 0;
      color: var(--primary);
      font-size: 38px;
    }

    .stat-icon {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      border-radius: 13px;
      font-size: 19px;
    }

    .stat-new .stat-icon {
      background: var(--info-soft);
      color: var(--info);
    }

    .stat-progress .stat-icon {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .stat-ready .stat-icon {
      background: var(--ready-soft);
      color: var(--ready);
    }

    .stat-delivered .stat-icon {
      background: var(--success-soft);
      color: var(--success);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 3px 0 13px;
    }

    .section-title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
    }

    .orders-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
    }

    .search-box span {
      position: absolute;
      top: 50%;
      right: 14px;
      color: var(--muted);
      font-size: 17px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-box input,
    .filter-select,
    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box input {
      height: 52px;
      padding: 0 44px 0 14px;
      font-size: 14px;
    }

    .filter-select {
      height: 49px;
      padding: 0 13px;
      appearance: auto;
      font-size: 14px;
    }

    .search-box input:focus,
    .filter-select:focus,
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(162, 54, 74, 0.12);
      outline: none;
    }

    .orders-list {
      display: grid;
      gap: 12px;
    }

    .order-card {
      position: relative;
      overflow: hidden;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 5px 20px rgba(127, 38, 57, 0.05);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .order-card:active {
      transform: scale(0.992);
    }

    .order-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .customer-name {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.4;
    }

    .piece-name {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-new {
      background: var(--info-soft);
      color: var(--info);
    }

    .status-progress {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-ready {
      background: var(--ready-soft);
      color: var(--ready);
    }

    .status-delivered {
      background: var(--success-soft);
      color: var(--success);
    }

    .order-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 15px 0 13px;
    }

    .meta-item {
      padding: 9px 10px;
      border-radius: 11px;
      background: var(--surface-soft);
    }

    .meta-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    .meta-value {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .text-button,
    .icon-button,
    .primary-button,
    .secondary-button,
    .danger-button {
      min-height: 44px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
    }

    .text-button:active,
    .icon-button:active,
    .primary-button:active,
    .secondary-button:active,
    .danger-button:active {
      transform: scale(0.97);
    }

    .text-button {
      padding: 0 5px;
      background: transparent;
      color: var(--primary);
      font-size: 13px;
    }

    .action-group {
      display: flex;
      gap: 4px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
    }

    .icon-button.danger {
      color: var(--danger);
    }

    .empty-state {
      padding: 40px 20px;
      border: 1px dashed #e8cdd1;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.56);
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 26px;
    }

    .empty-state h3 {
      margin: 0 0 7px;
      color: var(--text);
      font-size: 17px;
    }

    .empty-state p {
      margin: 0;
      font-size: 13px;
      line-height: 1.8;
    }

    .fab {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(18px, calc(18px + env(safe-area-inset-bottom)));
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      padding: 0 18px;
      border-radius: 18px;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 12px 25px rgba(127, 38, 57, 0.30);
      font-size: 14px;
      font-weight: 800;
    }

    .fab span:first-child {
      font-size: 22px;
      line-height: 1;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      background: rgba(59, 34, 41, 0.48);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(100%, 700px);
      max-height: min(92vh, 850px);
      overflow-y: auto;
      border-radius: 24px 24px 0 0;
      background: var(--surface);
      box-shadow: 0 -12px 40px rgba(59, 34, 41, 0.16);
      transform: translateY(100%);
      transition: transform 0.25s ease;
      overscroll-behavior: contain;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 42px;
      height: 4px;
      margin: 10px auto 2px;
      border-radius: 10px;
      background: #e8d3d6;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .close-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #faf1ef;
      color: var(--text);
      font-size: 22px;
    }

    .modal-body {
      padding: 18px;
    }

    .form-grid {
      display: grid;
      gap: 15px;
    }

    .form-field {
      display: grid;
      gap: 7px;
    }

    .form-field label {
      color: #6b4e55;
      font-size: 13px;
      font-weight: 700;
    }

    .form-field input,
    .form-field select {
      height: 51px;
      padding: 0 13px;
      font-size: 14px;
    }

    .form-field textarea {
      min-height: 104px;
      padding: 12px 13px;
      resize: vertical;
      font-size: 14px;
      line-height: 1.7;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .required {
      color: var(--danger);
    }

    .modal-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      min-height: 51px;
      padding: 0 16px;
      font-size: 14px;
    }

    .primary-button {
      background: var(--primary);
      color: #fff;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .danger-button {
      background: var(--danger);
      color: #fff;
    }

    .details-grid {
      display: grid;
      gap: 12px;
    }

    .detail-box {
      padding: 13px;
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .detail-box .detail-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .detail-box .detail-value {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .details-status-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px;
      padding: 14px;
      border-radius: 14px;
      background: var(--primary-soft);
    }

    .details-status-wrap span:first-child {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .status-select {
      min-height: 44px;
      max-width: 175px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      right: 50%;
      bottom: calc(92px + env(safe-area-inset-bottom));
      z-index: 300;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      border-radius: 14px;
      background: #4a2230;
      color: #fff;
      box-shadow: 0 10px 25px rgba(59, 34, 41, 0.25);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translate(50%, 15px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(50%, 0);
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fcf7f1;
      color: #a2364a;
      opacity: 1;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .splash.hide {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      width: min(82vw, 330px);
      text-align: center;
      animation: splashIn 0.55s ease both;
    }

    .splash-logo {
      display: block;
      width: min(70vw, 280px);
      height: auto;
      max-height: 310px;
      margin: 0 auto 20px;
      object-fit: contain;
      object-position: center;
    }

    .splash-title {
      margin: 0;
      color: #a2364a;
      font-size: 28px;
      font-weight: 800;
    }

    .splash-subtitle {
      margin: 8px 0 0;
      color: #7a6167;
      font-size: 15px;
      font-weight: 500;
    }

    @keyframes splashIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 560px) {
      .app-shell {
        padding-right: 22px;
        padding-left: 22px;
      }

      .controls {
        grid-template-columns: 1fr 175px;
      }

      .form-row {
        grid-template-columns: 1fr 1fr;
      }

      .modal-overlay {
        align-items: center;
        padding: 24px;
      }

      .modal {
        border-radius: 24px;
      }
    }
  </style>
</head>

            type="search"
            placeholder="ابحثي باسم العميلة أو القطعة"
            autocomplete="off"
            aria-label="البحث في الطلبات"
          />
        </div>

        <select id="statusFilter" class="filter-select" aria-label="تصفية الطلبات حسب الحالة">
          <option value="الكل">كل الحالات</option>
          <option value="جديد">جديد</option>
          <option value="قيد التنفيذ">قيد التنفيذ</option>
          <option value="جاهز">جاهز</option>
          <option value="تم التسليم">تم التسليم</option>
        </select>
      </div>

      <div id="ordersList" class="orders-list"></div>
    </section>
  </main>

  <button id="addOrderButton" class="fab" type="button" aria-label="إضافة طلب جديد">
    <span>＋</span>
    <span>إضافة طلب جديد</span>
  </button>

  <div id="formModalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
    <section class="modal">
      <div class="modal-handle"></div>

      <header class="modal-header">
        <h2 id="formModalTitle" class="modal-title">إضافة طلب جديد</h2>
        <button class="close-button" type="button" data-close="formModalOverlay" aria-label="إغلاق">×</button>
      </header>

      <form id="orderForm">
        <div class="modal-body">
          <input id="orderId" type="hidden" />

          <div class="form-grid">
            <div class="form-field">
              <label for="customerName">اسم العميلة <span class="required">*</span></label>
              <input id="customerName" type="text" placeholder="مثال: سارة أحمد" required maxlength="80" />
            </div>

            <div class="form-field">
              <label for="pieceName">اسم القطعة <span class="required">*</span></label>
              <input id="pieceName" type="text" placeholder="مثال: حقيبة كروشيه" required maxlength="100" />
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="color">اللون</label>
                <input id="color" type="text" placeholder="مثال: بيج" maxlength="50" />
              </div>

              <div class="form-field">
                <label for="price">السعر</label>
                <input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="مثال: 150" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="deliveryDate">موعد التسليم</label>
                <input id="deliveryDate" type="date" />
              </div>

              <div class="form-field">
                <label for="orderStatus">حالة الطلب</label>
                <select id="orderStatus">
                  <option value="جديد">جديد</option>
                  <option value="قيد التنفيذ">قيد التنفيذ</option>
                  <option value="جاهز">جاهز</option>
                  <option value="تم التسليم">تم التسليم</option>
                </select>
              </div>
            </div>

            <div class="form-field">
              <label for="notes">ملاحظات</label>
              <textarea id="notes" placeholder="أي تفاصيل إضافية عن الطلب..." maxlength="500"></textarea>
            </div>
          </div>
        </div>

        <footer class="modal-footer">
          <button class="secondary-button" type="button" data-close="formModalOverlay">إلغاء</button>
          <button class="primary-button" type="submit">حفظ الطلب</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="detailsModalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="detailsModalTitle">
    <section class="modal">
      <div class="modal-handle"></div>

      <header class="modal-header">
        <h2 id="detailsModalTitle" class="modal-title">تفاصيل الطلب</h2>
        <button class="close-button" type="button" data-close="detailsModalOverlay" aria-label="إغلاق">×</button>
      </header>

      <div id="detailsContent" class="modal-body"></div>

      <footer class="modal-footer">
        <button id="detailsEditButton" class="secondary-button" type="button">تعديل الطلب</button>
        <button id="detailsDeleteButton" class="danger-button" type="button">حذف الطلب</button>
      </footer>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "nay_crochet_orders_v1";
      const STATUSES = ["جديد", "قيد التنفيذ", "جاهز", "تم التسليم"];

      const state = {
        orders: [],
        selectedOrderId: null
      };

      const elements = {
        splash: document.getElementById("splashScreen"),
        todayDate: document.getElementById("todayDate"),
        totalOrders: document.getElementById("totalOrders"),
        newOrders: document.getElementById("newOrders"),
        progressOrders: document.getElementById("progressOrders"),
        readyOrders: document.getElementById("readyOrders"),
        deliveredOrders: document.getElementById("deliveredOrders"),
        visibleOrdersCount: document.getElementById("visibleOrdersCount"),
        ordersList: document.getElementById("ordersList"),
        searchInput: document.getElementById("searchInput"),
        statusFilter: document.getElementById("statusFilter"),
        addOrderButton: document.getElementById("addOrderButton"),
        formModalOverlay: document.getElementById("formModalOverlay"),
        detailsModalOverlay: document.getElementById("detailsModalOverlay"),
        formModalTitle: document.getElementById("formModalTitle"),
        orderForm: document.getElementById("orderForm"),
        orderId: document.getElementById("orderId"),
        customerName: document.getElementById("customerName"),
        pieceName: document.getElementById("pieceName"),
        color: document.getElementById("color"),
        price: document.getElementById("price"),
        deliveryDate: document.getElementById("deliveryDate"),
        orderStatus: document.getElementById("orderStatus"),
        notes: document.getElementById("notes"),
        detailsContent: document.getElementById("detailsContent"),
        detailsEditButton: document.getElementById("detailsEditButton"),
        detailsDeleteButton: document.getElementById("detailsDeleteButton"),
        toast: document.getElementById("toast")
      };

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function normalizeText(value) {
        return String(value || "").trim().toLowerCase();
      }

      function getStatusClass(status) {
        const classes = {
          "جديد": "status-new",
          "قيد التنفيذ": "status-progress",
          "جاهز": "status-ready",
          "تم التسليم": "status-delivered"
        };
        return classes[status] || "status-new";
      }

      function getStatusSymbol(status) {
        const symbols = {
          "جديد": "✦",
          "قيد التنفيذ": "◌",
          "جاهز": "✓",
          "تم التسليم": "✓"
        };
        return symbols[status] || "✦";
      }

      function formatPrice(value) {
        if (value === "" || value === null || value === undefined || Number.isNaN(Number(value))) {
          return "غير محدد";
        }

        const number = Number(value);

        return new Intl.NumberFormat("ar-DZ", {
          minimumFractionDigits: number % 1 === 0 ? 0 : 2,
          maximumFractionDigits: 2
        }).format(number) + " دج";
      }

      function formatDate(dateValue) {
        if (!dateValue) return "غير محدد";

        const parts = dateValue.split("-");
        if (parts.length !== 3) return dateValue;

        const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));

        if (Number.isNaN(date.getTime())) return dateValue;

        return new Intl.DateTimeFormat("ar-DZ", {
          day: "numeric",
          month: "short",
          year: "numeric"
        }).format(date);
      }

      function formatToday() {
        const date = new Date();

        elements.todayDate.textContent = new Intl.DateTimeFormat("ar-DZ", {
          weekday: "long",
          day: "numeric",
          month: "long"
        }).format(date);
      }

      function generateId() {
        return "order_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      }

      function loadOrders() {
        try {
          const savedOrders = localStorage.getItem(STORAGE_KEY);
          const parsedOrders = savedOrders ? JSON.parse(savedOrders) : [];

          if (Array.isArray(parsedOrders)) {
            state.orders = parsedOrders.map(function (order) {
              return {
                id: order.id || generateId(),
                customerName: order.customerName || "",
                pieceName: order.pieceName || "",
                color: order.color || "",
                price: order.price !== undefined ? order.price : "",
                deliveryDate: order.deliveryDate || "",
                notes: order.notes || "",
                status: STATUSES.includes(order.status) ? order.status : "جديد",
                createdAt: order.createdAt || Date.now(),
                updatedAt: order.updatedAt || Date.now()
              };
            });
          }
        } catch (error) {
          state.orders = [];
          showToast("تعذر تحميل البيانات المحفوظة");
        }
      }

      function saveOrders() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.orders));
        } catch (error) {
          showToast("تعذر حفظ البيانات في المتصفح");
        }
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("show");

        window.clearTimeout(showToast.timeout);

        showToast.timeout = window.setTimeout(function () {
          elements.toast.classList.remove("show");
        }, 2500);
      }

      function openModal(modal) {
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal(modal) {
        modal.classList.remove("active");

        if (
          !elements.formModalOverlay.classList.contains("active") &&
          !elements.detailsModalOverlay.classList.contains("active")
        ) {
          document.body.style.overflow = "";
        }
      }

      function getOrderById(id) {
        return state.orders.find(function (order) {
          return order.id === id;
        });
      }

      function updateStats() {
        const total = state.orders.length;

        const countByStatus = function (status) {
          return state.orders.filter(function (order) {
            return order.status === status;
          }).length;
        };

        elements.totalOrders.textContent = new Intl.NumberFormat("ar-DZ").format(total);
        elements.newOrders.textContent = new Intl.NumberFormat("ar-DZ").format(countByStatus("جديد"));
        elements.progressOrders.textContent = new Intl.NumberFormat("ar-DZ").format(countByStatus("قيد التنفيذ"));
        elements.readyOrders.textContent = new Intl.NumberFormat("ar-DZ").format(countByStatus("جاهز"));
        elements.deliveredOrders.textContent = new Intl.NumberFormat("ar-DZ").format(countByStatus("تم التسليم"));
      }

      function getFilteredOrders() {
        const query = normalizeText(elements.searchInput.value);
        const selectedStatus = elements.statusFilter.value;

        return state.orders
          .filter(function (order) {
            const matchesSearch =
              !query ||
              normalizeText(order.customerName).includes(query) ||
              normalizeText(order.pieceName).includes(query);

            const matchesStatus =
              selectedStatus === "الكل" || order.status === selectedStatus;

            return matchesSearch && matchesStatus;
          })
          .sort(function (a, b) {
            return Number(b.updatedAt || 0) - Number(a.updatedAt || 0);
          });
      }

      function renderOrders() {
        const orders = getFilteredOrders();

        elements.visibleOrdersCount.textContent =
          new Intl.NumberFormat("ar-DZ").format(orders.length) +
          (orders.length === 1 ? " طلب" : " طلبات");

        if (!orders.length) {
          const hasFilters =
            elements.searchInput.value.trim() ||
            elements.statusFilter.value !== "الكل";

          elements.ordersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">${hasFilters ? "⌕" : "◈"}</div>
              <h3>${hasFilters ? "لا توجد نتائج مطابقة" : "لا توجد طلبات حتى الآن"}</h3>
              <p>${hasFilters ? "جرّبي تغيير البحث أو فلتر الحالة." : "ابدئي بإضافة أول طلب لتجدي كل تفاصيله هنا."}</p>
            </div>
          `;
          return;
        }

        elements.ordersList.innerHTML = orders.map(function (order) {
          return `
            <article class="order-card" data-id="${escapeHtml(order.id)}">
              <div class="order-card-top">
                <div>
                  <h3 class="customer-name">${escapeHtml(order.customerName)}</h3>
                  <p class="piece-name">${escapeHtml(order.pieceName)}</p>
                </div>

                <span class="status-badge ${getStatusClass(order.status)}">
                  <span>${getStatusSymbol(order.status)}</span>
                  ${escapeHtml(order.status)}
                </span>
              </div>

              <div class="order-meta">
                <div class="meta-item">
                  <span class="meta-label">اللون</span>
                  <span class="meta-value">${escapeHtml(order.color || "غير محدد")}</span>
                </div>

                <div class="meta-item">
                  <span class="meta-label">موعد التسليم</span>
                  <span class="meta-value">${escapeHtml(formatDate(order.deliveryDate))}</span>
                </div>

                <div class="meta-item">
                  <span class="meta-label">السعر</span>
                  <span class="meta-value">${escapeHtml(formatPrice(order.price))}</span>
                </div>

                <div class="meta-item">
                  <span class="meta-label">الحالة</span>
                  <span class="meta-value">${escapeHtml(order.status)}</span>
                </div>
              </div>

              <div class="card-actions">
                <button class="text-button" type="button" data-action="details" data-id="${escapeHtml(order.id)}">
                  عرض التفاصيل
                </button>

                <div class="action-group">
                  <button class="icon-button" type="button" data-action="edit" data-id="${escapeHtml(order.id)}" aria-label="تعديل الطلب">
                    ✎
                  </button>

                  <button class="icon-button danger" type="button" data-action="delete" data-id="${escapeHtml(order.id)}" aria-label="حذف الطلب">
                    ⌫
                  </button>
                </div>
              </div>
            </article>
          `;
        }).join("");
      }

      function renderApp() {
        updateStats();
        renderOrders();
      }

      function resetForm() {
        elements.orderForm.reset();
        elements.orderId.value = "";
        elements.orderStatus.value = "جديد";
      }

      function openAddOrderModal() {
        resetForm();
        elements.formModalTitle.textContent = "إضافة طلب جديد";
        openModal(elements.formModalOverlay);

        window.setTimeout(function () {
          elements.customerName.focus();
        }, 250);
      }

      function openEditOrderModal(id) {
        const order = getOrderById(id);
        if (!order) return;

        elements.orderId.value = order.id;
        elements.customerName.value = order.customerName;
        elements.pieceName.value = order.pieceName;
        elements.color.value = order.color;
        elements.price.value = order.price;
        elements.deliveryDate.value = order.deliveryDate;
        elements.orderStatus.value = order.status;
        elements.notes.value = order.notes;
        elements.formModalTitle.textContent = "تعديل الطلب";

        closeModal(elements.detailsModalOverlay);
        openModal(elements.formModalOverlay);

        window.setTimeout(function () {
          elements.customerName.focus();
        }, 250);
      }

      function openDetailsModal(id) {
        const order = getOrderById(id);
        if (!order) return;

        state.selectedOrderId = id;

        elements.detailsContent.innerHTML = `
          <div class="details-status-wrap">
            <span>تغيير حالة الطلب</span>

            <select id="detailsStatusSelect" class="status-select" aria-label="تغيير حالة الطلب">
              ${STATUSES.map(function (status) {
                return `
                  <option value="${escapeHtml(status)}" ${order.status === status ? "selected" : ""}>
                    ${escapeHtml(status)}
                  </option>
                `;
              }).join("")}
            </select>
          </div>

          <div class="details-grid">
            <div class="detail-box">
              <span class="detail-label">اسم العميلة</span>
              <span class="detail-value">${escapeHtml(order.customerName)}</span>
            </div>

            <div class="detail-box">
              <span class="detail-label">اسم القطعة</span>
              <span class="detail-value">${escapeHtml(order.pieceName)}</span>
            </div>

            <div class="detail-box">
              <span class="detail-label">اللون</span>
              <span class="detail-value">${escapeHtml(order.color || "غير محدد")}</span>
            </div>

            <div class="detail-box">
              <span class="detail-label">السعر</span>
              <span class="detail-value">${escapeHtml(formatPrice(order.price))}</span>
            </div>

            <div class="detail-box">
              <span class="detail-label">موعد التسليم</span>
              <span class="detail-value">${escapeHtml(formatDate(order.deliveryDate))}</span>
            </div>

            <div class="detail-box">
              <span class="detail-label">ملاحظات</span>
              <span class="detail-value">${escapeHtml(order.notes || "لا توجد ملاحظات")}</span>
            </div>
          </div>
        `;

        openModal(elements.detailsModalOverlay);
      }

      function deleteOrder(id) {
        const order = getOrderById(id);
        if (!order) return;

        const confirmed = window.confirm(
          "هل أنتِ متأكدة من حذف طلب " +
          order.customerName +
          "؟ لا يمكن التراجع عن هذا الإجراء."
        );

        if (!confirmed) return;

        state.orders = state.orders.filter(function (item) {
          return item.id !== id;
        });

        saveOrders();
        renderApp();
        closeModal(elements.detailsModalOverlay);
        showToast("تم حذف الطلب");
      }

      function updateOrderStatus(id, status) {
        const order = getOrderById(id);
        if (!order || !STATUSES.includes(status)) return;

        order.status = status;
        order.updatedAt = Date.now();

        saveOrders();
        renderApp();
        openDetailsModal(id);
        showToast("تم تحديث حالة الطلب");
      }

      function handleFormSubmit(event) {
        event.preventDefault();

        const customerName = elements.customerName.value.trim();
        const pieceName = elements.pieceName.value.trim();

        if (!customerName || !pieceName) {
          showToast("يرجى إدخال اسم العميلة واسم القطعة");
          return;
        }

        const orderData = {
          customerName: customerName,
          pieceName: pieceName,
          color: elements.color.value.trim(),
          price: elements.price.value.trim(),
          deliveryDate: elements.deliveryDate.value,
          notes: elements.notes.value.trim(),
          status: elements.orderStatus.value,
          updatedAt: Date.now()
        };

        const existingId = elements.orderId.value;

        if (existingId) {
          const order = getOrderById(existingId);

          if (order) {
            Object.assign(order, orderData);
            showToast("تم تعديل الطلب بنجاح");
          }
        } else {
          state.orders.push({
            id: generateId(),
            createdAt: Date.now(),
            ...orderData
          });

          showToast("تمت إضافة الطلب بنجاح");
        }

        saveOrders();
        renderApp();
        closeModal(elements.formModalOverlay);
      }

      function setupEventListeners() {
        elements.addOrderButton.addEventListener("click", openAddOrderModal);

        elements.searchInput.addEventListener("input", renderOrders);
        elements.statusFilter.addEventListener("change", renderOrders);

        elements.orderForm.addEventListener("submit", handleFormSubmit);

        elements.ordersList.addEventListener("click", function (event) {
          const button = event.target.closest("[data-action]");
          if (!button) return;

          const action = button.dataset.action;
          const id = button.dataset.id;

          if (action === "details") openDetailsModal(id);
          if (action === "edit") openEditOrderModal(id);
          if (action === "delete") deleteOrder(id);
        });

        elements.detailsEditButton.addEventListener("click", function () {
          if (state.selectedOrderId) {
            openEditOrderModal(state.selectedOrderId);
          }
        });

        elements.detailsDeleteButton.addEventListener("click", function () {
          if (state.selectedOrderId) {
            deleteOrder(state.selectedOrderId);
          }
        });

        document.addEventListener("change", function (event) {
          if (
            event.target &&
            event.target.id === "detailsStatusSelect" &&
            state.selectedOrderId
          ) {
            updateOrderStatus(state.selectedOrderId, event.target.value);
          }
        });

        document.addEventListener("click", function (event) {
          const closeButton = event.target.closest("[data-close]");

          if (closeButton) {
            const modal = document.getElementById(closeButton.dataset.close);

            if (modal) {
              closeModal(modal);
            }

            return;
          }

          if (event.target === elements.formModalOverlay) {
            closeModal(elements.formModalOverlay);
          }

          if (event.target === elements.detailsModalOverlay) {
            closeModal(elements.detailsModalOverlay);
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeModal(elements.formModalOverlay);
            closeModal(elements.detailsModalOverlay);
          }
        });
      }

      function hideSplash() {
        window.setTimeout(function () {
          elements.splash.classList.add("hide");
        }, 850);

        window.setTimeout(function () {
          elements.splash.remove();
        }, 1450);
      }

      function init() {
        formatToday();
        loadOrders();
        renderApp();
        setupEventListeners();
        hideSplash();
      }

      init();
    })();
  </script>
</body>
</html>
